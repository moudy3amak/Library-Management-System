<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Library System</title>
    <link rel="stylesheet" href="style.css">
    <script src="add-book.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Library Management System</h1>
        <h2>Add a New Book</h2>

        <form id="addBookForm">
            <label for="title">Book Title</label>
            <input type="text" id="title" name="title"
                   placeholder="Enter book title" autocomplete="off" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author"
                   placeholder="Enter author name" autocomplete="name" required>

            <label for="category">Category</label>
            <input type="text" id="category" name="category"
                   placeholder="Enter book category" required>

            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" name="isbn"
                   placeholder="Enter ISBN" inputmode="numeric"
                   autocomplete="off" required>

            <button id="addBookButton" type="submit">Add Book</button>
            <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        </form>
    </main>
</body>
</html>
